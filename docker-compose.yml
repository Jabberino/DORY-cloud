services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://swimuser:swimpass@db:5432/swimdb
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: swimuser
      POSTGRES_PASSWORD: swimpass
      POSTGRES_DB: swimdb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swimuser -d swimdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: